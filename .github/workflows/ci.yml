name: Validate extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: xvfb-run -a npm run test:editor
      - run: npm run package
      - run: xvfb-run -a npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: strata-control
          path: strata-control.vsix
